appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
- runFlow: _demo/pause-1500.yaml
- runFlow: _demo/cap-guest-browse-1.yaml
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 120000
- runFlow: _demo/pause-500.yaml
- assertVisible:
    id: topbar.signin
- runFlow: _demo/pause-1200.yaml
- assertNotVisible:
    id: topbar.notifications
- scrollUntilVisible:
    element:
      id: job.open.5eed0000-0000-4000-8000-00000000b001
    timeout: 60000
- runFlow: _demo/pause-400.yaml
- runFlow: _demo/cap-guest-browse-2.yaml
- tapOn:
    id: job.open.5eed0000-0000-4000-8000-00000000b001
- runFlow: _demo/pause-900.yaml
- extendedWaitUntil:
    visible:
      id: job.screen
    timeout: 30000
- runFlow: _demo/pause-500.yaml
- assertVisible:
    id: job.header
- runFlow: _demo/pause-1200.yaml
- scrollUntilVisible:
    element:
      id: job.savebutton
    timeout: 30000
- runFlow: _demo/pause-400.yaml
- runFlow: _demo/cap-guest-browse-3.yaml
- tapOn:
    id: job.savebutton
- runFlow: _demo/pause-900.yaml
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 15000
- runFlow: _demo/pause-500.yaml
- runFlow: _demo/cap-guest-browse-4.yaml
- tapOn:
    id: login.email
- runFlow: _demo/pause-900.yaml
- inputText: applicant@apronhanger.test
- runFlow: _demo/pause-600.yaml
- tapOn:
    id: login.password
- runFlow: _demo/pause-900.yaml
- inputText: Test@1234
- runFlow: _demo/pause-600.yaml
- runFlow: _common/hideKeyboard.yaml
- runFlow:
    when:
      visible:
        id: login.submit
    commands:
    - tapOn:
        id: login.submit
- runFlow:
    when:
      platform: Android
      visible: Save password.*
    commands:
    - back
- runFlow:
    when:
      platform: iOS
    commands:
    - extendedWaitUntil:
        visible: Save Password.*
        timeout: 8000
        optional: true
- runFlow:
    when:
      platform: iOS
      visible: Save Password.*
    commands:
    - tapOn: Not Now
- runFlow: _demo/cap-guest-browse-5.yaml
- extendedWaitUntil:
    visible:
      id: job.savebutton
    timeout: 90000
- runFlow: _demo/pause-500.yaml
- assertNotVisible:
    id: login.screen
- scrollUntilVisible:
    element: Your profile matches.*
    timeout: 30000
- runFlow: _demo/pause-400.yaml
- runFlow: _demo/pause-2500.yaml
