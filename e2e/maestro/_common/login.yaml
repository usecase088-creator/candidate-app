# Shared steps: start clean, sign in with the seeded candidate and land on Home. Used with `runFlow`.
# (Maestro only runs the top-level files of e2e/maestro, so this folder is not run on its own.)
appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 120000
- tapOn:
    id: login.email
- inputText: candidate@apronhanger.test
- tapOn:
    id: login.password
- inputText: Test@1234
- hideKeyboard
- tapOn:
    id: login.submit
- extendedWaitUntil:
    notVisible:
      id: login.screen
    timeout: 20000
# Android may offer to save the password: wait for it (optional) and close it with Back. Never tap "Never".
- extendedWaitUntil:
    visible: 'Save password.*'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: 'Save password.*'
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 20000
