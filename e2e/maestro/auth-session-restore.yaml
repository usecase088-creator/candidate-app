# Sign in, stop the app, start it again: still signed in (token in SecureStore, checked with /api/auth/me).
appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 120000
- tapOn:
    id: login.email
- inputText: candidate@apronhanger.test
- tapOn:
    id: login.password
- inputText: Test@1234
- runFlow: _common/hideKeyboard.yaml
# iOS: Return on the password field already submits the form, so only tap Sign in if it is still there.
- runFlow:
    when:
      visible:
        id: login.submit
    commands:
      - tapOn:
          id: login.submit
- extendedWaitUntil:
    notVisible:
      id: login.screen
    timeout: 20000
- extendedWaitUntil:
    visible: 'Save password.*'
    timeout: 8000
    optional: true
- runFlow:
    when:
      platform: Android
      visible: 'Save password.*'
    commands:
      - back
# iOS: the system "Save Password?" sheet. Never tap "Save".
- runFlow:
    when:
      platform: iOS
      visible: 'Save Password.*'
    commands:
      - tapOn: Not Now
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 20000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 30000
- assertVisible: Your next clinical role, curated for you.
- assertNotVisible:
    id: login.screen
