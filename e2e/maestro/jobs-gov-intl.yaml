# Government and international listings: lists, deadline styling, search, country chips, outside links in the browser.
# Local backend with the seeded listings (scripts/backend-local/overlay/app-scripts/seedData.ts).
appId: work.apronhanger.candidate.dev
---
- runFlow: _common/login.yaml

# Government jobs
- scrollUntilVisible:
    element:
      id: home.link.gov
    timeout: 20000
- tapOn:
    id: home.link.gov
- extendedWaitUntil:
    visible:
      id: gov.screen
    timeout: 10000
- assertVisible: Government jobs
- extendedWaitUntil:
    visible: Total Listings
    timeout: 20000
# The cards, top to bottom (on a small iPhone they do not all fit): each scroll only moves forward.
- scrollUntilVisible:
    element: No deadline
    timeout: 10000
- scrollUntilVisible:
    element: 'Expired · .*'
    timeout: 10000
# The seeded deadline is relative to the day the demo data was seeded: any number of days left is right.
- scrollUntilVisible:
    element: '\d+d left'
    timeout: 10000
- scrollUntilVisible:
    element: AIIMS
    timeout: 10000

# Search narrows the list.
- scrollUntilVisible:
    element:
      id: gov.search
    direction: UP
    timeout: 10000
- tapOn:
    id: gov.search
- inputText: esic
- runFlow: _common/hideKeyboard.yaml
- assertVisible: Specialist Walk-in (Test, no deadline)
- assertNotVisible: AIIMS
- tapOn:
    id: gov.search
- eraseText: 10
- runFlow: _common/hideKeyboard.yaml

# "View / Apply" opens the outside link in the in-app browser, away from the app; Back returns.
- scrollUntilVisible:
    element:
      id: gov.apply.5eed0000-0000-4000-8000-00000000c001
    timeout: 15000
- tapOn:
    id: gov.apply.5eed0000-0000-4000-8000-00000000c001
- extendedWaitUntil:
    notVisible:
      id: gov.screen
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: gov.screen
    timeout: 15000

# International jobs. D32: the gov screen has the native header; leave it with the system back (Android) or the
# edge swipe (iPhone).
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 70%, 50%
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: home.link.intl
    timeout: 20000
- tapOn:
    id: home.link.intl
- extendedWaitUntil:
    visible:
      id: intl.screen
    timeout: 10000
- assertVisible: International jobs
- assertVisible: Countries
- scrollUntilVisible:
    element:
      id: intl.country.UAE
    timeout: 10000
- tapOn:
    id: intl.country.UAE
- scrollUntilVisible:
    element: Pharmacist \(Test\)
    timeout: 10000
- assertNotVisible: Staff Nurse \(Test\)
- scrollUntilVisible:
    element:
      id: intl.apply.5eed0000-0000-4000-8000-00000000d002
    timeout: 15000
- tapOn:
    id: intl.apply.5eed0000-0000-4000-8000-00000000d002
- extendedWaitUntil:
    notVisible:
      id: intl.screen
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Done
- extendedWaitUntil:
    visible:
      id: intl.screen
    timeout: 15000
