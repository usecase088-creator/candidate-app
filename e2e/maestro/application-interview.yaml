# Answer interviews: accept one, ask to reschedule another. Demo applicant, seeded applications.
# Needs: npm run backend:local (the seed resets the applications) and Metro; on iPhone the staging server.
# NOT YET RUN ON A DEVICE (written 2026-10-27 with no phone attached): run it once with the phone before relying on it.
appId: work.apronhanger.candidate.dev
---
- runFlow: _common/loginApplicant.yaml
- tapOn:
    id: tabs.applications
- extendedWaitUntil:
    visible:
      id: applications.screen
    timeout: 20000
# The list comes from the server and can take a while on a slow link: wait for the tab row before anything else.
- extendedWaitUntil:
    visible:
      id: applications.tab.all
    timeout: 90000

# A tab filters the list: Applied shows only the new application, All brings the rest back.
- tapOn:
    id: applications.tab.applied
- assertVisible:
    id: application.row.5eed0000-0000-4000-8000-00000000a101
- assertNotVisible:
    id: application.row.5eed0000-0000-4000-8000-00000000a102
- tapOn:
    id: applications.tab.all

# Virtual interview: Join Meeting is there, Accept.
- scrollUntilVisible:
    element:
      id: application.row.5eed0000-0000-4000-8000-00000000a102
    timeout: 30000
- tapOn:
    id: application.row.5eed0000-0000-4000-8000-00000000a102
- extendedWaitUntil:
    visible:
      id: application.screen
    timeout: 15000
- assertVisible: Interview Scheduled
- assertVisible: Join Meeting
- assertVisible: Dr. Seed Interviewer
- tapOn:
    id: action.interview.accept
- extendedWaitUntil:
    visible: Response recorded successfully!
    timeout: 15000
- assertVisible: 'Status: Interview Accepted'
# The toast sits over the Back button at the top: a tap there only dismisses it. Wait until it has gone.
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 10000
- tapOn:
    id: application.back
- extendedWaitUntil:
    visible:
      id: applications.screen
    timeout: 15000

# In-person interview: ask to reschedule (a note is required).
# Back to the list on an iPhone keeps the scroll position, so the tab row can be off screen: scroll up to it.
- scrollUntilVisible:
    element:
      id: applications.tab.all
    direction: UP
    timeout: 60000
- scrollUntilVisible:
    element:
      id: application.row.5eed0000-0000-4000-8000-00000000a103
    timeout: 30000
- tapOn:
    id: application.row.5eed0000-0000-4000-8000-00000000a103
- extendedWaitUntil:
    visible:
      id: application.screen
    timeout: 15000
- assertVisible: Seed Valley Care Centre, 2nd floor, Bengaluru
- tapOn:
    id: action.interview.reschedule
# The form opens below the buttons: on a small iPhone the Send button and the note are not on screen together.
- scrollUntilVisible:
    element:
      id: action.interview.reschedule.submit
    timeout: 15000
- assertVisible:
    id: action.interview.reschedule.submit
    enabled: false
- scrollUntilVisible:
    element:
      id: action.interview.note
    direction: UP
    timeout: 15000
- tapOn:
    id: action.interview.note
- inputText: Free on Friday after 3 pm
- runFlow: _common/hideKeyboard.yaml
- scrollUntilVisible:
    element:
      id: action.interview.reschedule.submit
    timeout: 15000
- tapOn:
    id: action.interview.reschedule.submit
- extendedWaitUntil:
    visible: Response recorded successfully!
    timeout: 15000
- assertVisible: 'Status: Reschedule Requested'
