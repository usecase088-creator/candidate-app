# iPhone simulator tests on GitHub's macOS runners (PHASE-1 Task 10). No Mac, no iPhone, no Expo paid plan needed:
# EAS builds the iOS simulator app for free (`eas build -p ios --profile e2e-test`); this job downloads the latest one,
# runs our Maestro flows on an iPhone simulator, and keeps screenshots and a video.
# Started by hand only: macOS minutes count 10x against the free GitHub allowance (about 15 runs a month).
name: ios-e2e

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build id (empty = latest finished iOS e2e-test build)
        required: false
        default: ''
      flows:
        description: Maestro flow files (space separated)
        required: false
        default: e2e/maestro

jobs:
  # Cheap Linux job (1x minutes): the project's app.config.ts needs its packages installed for eas-cli to read it.
  find-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    outputs:
      id: ${{ steps.build.outputs.id }}
      url: ${{ steps.build.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Find the iOS simulator build on EAS
        id: build
        run: |
          if [ -n "${{ inputs.build_id }}" ]; then
            npx eas-cli build:view "${{ inputs.build_id }}" --json > build.json
          else
            npx eas-cli build:list --platform ios --buildProfile e2e-test --status finished               --limit 1 --json --non-interactive | jq '.[0]' > build.json
          fi
          echo "id=$(jq -r '.id' build.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.artifacts.buildUrl' build.json)" >> "$GITHUB_OUTPUT"
          jq '{id, buildProfile, appVersion, gitCommitHash, completedAt}' build.json

  ios-simulator:
    needs: find-build
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack the .app
        run: |
          curl -sSL "${{ needs.find-build.outputs.url }}" -o app.tar.gz
          mkdir app && tar -xzf app.tar.gz -C app
          APP=$(find app -maxdepth 3 -name '*.app' -type d | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "App: $APP"

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted

      - name: Install the app
        run: xcrun simctl install "$UDID" "$APP"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The staging server (Render free plan) sleeps: wake it up, or the first sign-in would time out after 20 s.
      - name: Wake the staging server
        run: |
          for i in $(seq 1 24); do
            if curl -sf -m 20 https://apronhanger-staging-api.onrender.com/health; then echo; exit 0; fi
            sleep 5
          done
          echo 'staging did not answer'; exit 1

      - name: Run Maestro flows (with screen recording)
        run: |
          mkdir -p output
          xcrun simctl io "$UDID" recordVideo --codec=h264 output/run.mp4 &
          REC=$!
          set +e
          # One Maestro run per flow: `clearState` does not clear the iOS keychain (where the login token lives), so
          # every flow starts from a freshly reinstalled app and an empty keychain.
          if [ -d "${{ inputs.flows }}" ]; then FLOWS=$(ls ${{ inputs.flows }}/*.yaml); else FLOWS="${{ inputs.flows }}"; fi
          RESULT=0
          for f in $FLOWS; do
            n=$(basename "$f" .yaml)
            xcrun simctl terminate "$UDID" work.apronhanger.candidate.dev 2>/dev/null
            xcrun simctl uninstall "$UDID" work.apronhanger.candidate.dev 2>/dev/null
            xcrun simctl keychain "$UDID" reset 2>/dev/null
            xcrun simctl install "$UDID" "$APP"
            maestro --device "$UDID" test "$f" --format junit --output "output/report-$n.xml"               --debug-output "output/maestro-$n" || RESULT=1
            xcrun simctl io "$UDID" screenshot "output/end-$n.png"
            maestro --device "$UDID" hierarchy > "output/hierarchy-$n.json" 2>&1 || true
          done
          set -e
          sleep 2
          xcrun simctl io "$UDID" screenshot output/final.png
          kill -INT $REC; wait $REC || true
          exit $RESULT

      - name: Keep screenshots, video and Maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-${{ needs.find-build.outputs.id }}
          path: output
          retention-days: 14
