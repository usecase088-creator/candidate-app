- runFlow: _demo/pause-900.yaml
- tapOn:
    text: Add
    optional: true
- runFlow: _demo/pause-900.yaml
- scrollUntilVisible:
    element:
      id: action.docs.upload
    timeout: 60000
- runFlow: _demo/pause-400.yaml
- scrollUntilVisible:
