# iPhone only: the system "Save Password?" sheet can open minutes after sign-in (slow runners) and cover whatever screen is
# up. Close it with "Not Now" when it is showing; never tap "Save". Does nothing on Android or when the sheet is not there.
appId: work.apronhanger.candidate.dev
---
- runFlow:
    when:
      platform: iOS
      visible: 'Save Password.*'
    commands:
      - tapOn: Not Now
