appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
- runFlow: _demo/pause-1500.yaml
- runFlow: _common/openSignIn.yaml
- runFlow: _demo/cap-auth-forgot-password-1.yaml
- tapOn:
    id: login.forgot
- runFlow: _demo/pause-900.yaml
- extendedWaitUntil:
    visible: Reset Password
    timeout: 10000
- runFlow: _demo/pause-500.yaml
- runFlow: _demo/cap-auth-forgot-password-2.yaml
- tapOn:
    id: forgot.mobile
- runFlow: _demo/pause-900.yaml
- inputText: '9000000001'
- runFlow: _demo/pause-600.yaml
- runFlow: _common/hideKeyboard.yaml
- runFlow:
    when:
      platform: Android
    commands:
    - tapOn:
        id: forgot.submit
- extendedWaitUntil:
    visible: Enter the OTP sent to 9000000001.
    timeout: 20000
- runFlow: _demo/pause-500.yaml
- runFlow: _demo/cap-auth-forgot-password-3.yaml
- tapOn:
    id: forgot.otp
- runFlow: _demo/pause-900.yaml
- inputText: '123456'
- runFlow: _demo/pause-600.yaml
- runFlow: _common/hideKeyboard.yaml
- tapOn:
    id: forgot.submit
- runFlow: _demo/pause-900.yaml
- extendedWaitUntil:
    visible: Set a new password for c.*e@apronhanger.test
    timeout: 20000
- runFlow: _demo/pause-500.yaml
- runFlow: _demo/cap-auth-forgot-password-4.yaml
- tapOn:
    id: forgot.password
- runFlow: _demo/pause-900.yaml
- inputText: Test@1234
- runFlow: _demo/pause-600.yaml
- runFlow: _common/hideKeyboard.yaml
- runFlow:
    when:
      platform: Android
    commands:
    - tapOn:
        id: forgot.submit
- runFlow: _demo/cap-auth-forgot-password-5.yaml
- extendedWaitUntil:
    visible: Success!
    timeout: 20000
- runFlow: _demo/pause-500.yaml
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 10000
- runFlow: _demo/pause-500.yaml
- runFlow: _demo/pause-2500.yaml
