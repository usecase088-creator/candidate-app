# Reset the seeded candidate's password with test number 9000000001 (OTP 123456, D3).
# Sets it to the same Test@1234, so the other flows keep working. Uses 3 of the 5 OTP requests per 15 min.
appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 120000
- tapOn:
    id: login.forgot
- extendedWaitUntil:
    visible: Reset Password
    timeout: 10000
- tapOn:
    id: forgot.mobile
- inputText: '9000000001'
- runFlow: _common/hideKeyboard.yaml
# iOS: Return on this field already sends the OTP.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: forgot.submit
- extendedWaitUntil:
    visible: 'Enter the OTP sent to 9000000001.'
    timeout: 20000
- tapOn:
    id: forgot.otp
- inputText: '123456'
- runFlow: _common/hideKeyboard.yaml
- tapOn:
    id: forgot.submit
- extendedWaitUntil:
    visible: 'Set a new password for c.*e@apronhanger.test'
    timeout: 20000
- tapOn:
    id: forgot.password
- inputText: Test@1234
- runFlow: _common/hideKeyboard.yaml
# iOS: Return on the password field already saves it.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: forgot.submit
- extendedWaitUntil:
    visible: Success!
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 10000
