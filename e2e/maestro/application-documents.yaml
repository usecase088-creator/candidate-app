# Upload the documents a hospital asked for, choosing a photo from the gallery. Demo applicant, seeded applications.
# Needs: npm run backend:local (the seed resets the applications) and Metro. The upload goes to Cloudinary through the
# backend, so this flow only passes where the backend has Cloudinary keys (the local copy of the website backend has).
# NOT YET RUN ON A DEVICE (written 2026-10-27 with no phone attached). The system photo picker is outside our app:
# if its first photo cannot be tapped on a phone, pick it by hand and let the flow carry on from there.
appId: work.apronhanger.candidate.dev
---
- runFlow: _common/loginApplicant.yaml
- addMedia:
    - ../../assets/images/icon.png
- tapOn:
    id: tabs.applications
- extendedWaitUntil:
    visible:
      id: applications.screen
    timeout: 20000
# The list comes from the server and can take a while on a slow link: wait for the tab row before anything else.
- extendedWaitUntil:
    visible:
      id: applications.tab.all
    timeout: 90000
- scrollUntilVisible:
    element:
      id: application.row.5eed0000-0000-4000-8000-00000000a104
    timeout: 30000
- tapOn:
    id: application.row.5eed0000-0000-4000-8000-00000000a104
- extendedWaitUntil:
    visible:
      id: application.screen
    timeout: 15000
- assertVisible: Document Request
- assertVisible: '• Medical registration certificate'
- scrollUntilVisible:
    element: No files selected
    timeout: 15000

# Gallery: the phone's own photo picker. Pick the first photo (the one added above).
- scrollUntilVisible:
    element:
      id: action.docs.files.pick.gallery
    timeout: 15000
- tapOn:
    id: action.docs.files.pick.gallery
# The phone's own photo picker (Google Photos on this phone) opens over the app. The photo added above is the newest, so
# it is the first tile: tap only that one, never a position further in (the rest is the owner's own library).
- extendedWaitUntil:
    visible: 'Search Google Photos'
    timeout: 30000
    optional: true
- tapOn:
    point: 17%,57%
# Several photos may be chosen, so the picker asks to confirm ("Done" in Google Photos, "Add" in some others).
- tapOn:
    text: 'Done'
    optional: true
- tapOn:
    text: 'Add'
    optional: true
# The Upload button is below the file list: scroll to it (it only exists once a file is chosen).
- scrollUntilVisible:
    element:
      id: action.docs.upload
    timeout: 60000
- scrollUntilVisible:
    element: 1 file(s) selected
    direction: UP
    timeout: 15000
- scrollUntilVisible:
    element:
      id: action.docs.upload
    timeout: 15000

# Upload -> "Documents uploaded successfully!" -> the card now says the documents are submitted.
- tapOn:
    id: action.docs.upload
- extendedWaitUntil:
    visible: Documents uploaded successfully!
    timeout: 60000
- assertVisible: Documents Submitted
