# Apply from a job with Quick Apply, answering the job's own questions. Demo applicant (filled profile).
# Needs: npm run backend:local (the seed resets the applicant's applications) and Metro; on iPhone the staging server.
# NOT YET RUN ON A DEVICE (written 2026-10-27 with no phone attached): run it once with the phone before relying on it.
appId: work.apronhanger.candidate.dev
---
- runFlow: _common/loginApplicant.yaml

# Home -> the Radiology Technician job (the one with five job questions) -> Apply Now.
- scrollUntilVisible:
    element:
      id: job.open.5eed0000-0000-4000-8000-00000000b003
    timeout: 30000
- tapOn:
    id: job.open.5eed0000-0000-4000-8000-00000000b003
- extendedWaitUntil:
    visible:
      id: job.screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: job.apply
    timeout: 15000
- tapOn:
    id: job.apply

# The chooser: with a form CV, Quick Apply and CV upload are open.
- extendedWaitUntil:
    visible:
      id: apply.screen
    timeout: 20000
- assertVisible: Choose one way to apply
# Below the fold on a small iPhone: scroll to it (assertVisible does not scroll).
- scrollUntilVisible:
    element: Answer these job-specific questions
    timeout: 15000

# A required question left empty: the website message, nothing is sent.
- scrollUntilVisible:
    element:
      id: apply.quick
    timeout: 15000
- tapOn:
    id: apply.quick
# D32: the message shows under its own field, which the screen scrolls into view (both directions are tried).
- scrollUntilVisible:
    element: '"Which imaging machines have you operated?" is required'
    direction: DOWN
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element: '"Which imaging machines have you operated?" is required'
    direction: UP
    timeout: 15000

# Answer the questions (text, number, choice, yes/no; the optional long text stays empty).
# centerElement: the first field sat at the very top edge after scrolling up, and on an iPhone the typing was lost.
- scrollUntilVisible:
    element:
      id: apply.questions.q_modality
    direction: UP
    timeout: 15000
    centerElement: true
- tapOn:
    id: apply.questions.q_modality
- inputText: 128-slice CT
- runFlow: _common/hideKeyboard.yaml
- scrollUntilVisible:
    element:
      id: apply.questions.q_scans
    timeout: 15000
    centerElement: true
# iPhone (ios-e2e runs 1 and 2): the page was still gliding after the scroll, the tap landed where the field had been,
# so the field never took focus and the typed '12' went nowhere. Wait for the page to stop, and check the answer is in
# the field (tap and type again if not).
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: apply.questions.q_scans
      # Let the screen settle (it scrolls the field above the keyboard) before typing.
      - waitForAnimationToEnd
      - eraseText: 5
      - inputText: '12'
      - assertVisible:
          id: apply.questions.q_scans
          text: '12'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# iPhone: the number pad has no Return key, so Enter would leave it open over the choices below (Maestro would then tap
# the keyboard). Tap the question's label instead: a tap that no control takes closes the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: apply.questions.q_scans.labelRow
          direction: UP
          timeout: 10000
      - tapOn:
          id: apply.questions.q_scans.labelRow
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: apply.questions.q_shift.option.1
    timeout: 15000
- tapOn:
    id: apply.questions.q_shift.option.1
- scrollUntilVisible:
    element:
      id: apply.questions.q_license.yes
    timeout: 15000
- tapOn:
    id: apply.questions.q_license.yes

# Quick Apply -> "Application submitted!" -> My Applications with the new row.
- scrollUntilVisible:
    element:
      id: apply.quick
    timeout: 15000
- tapOn:
    id: apply.quick
- extendedWaitUntil:
    visible: Application submitted!
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: applications.screen
    timeout: 20000
# The list is loaded from the server again: wait for the new row. On an iPhone the card is one element whose text
# continues with the hospital and date, so match the start of it.
- extendedWaitUntil:
    visible: 'Radiology Technician.*'
    timeout: 90000
# The seed has 8; this adds one. apply-form (run before this in a full run) may have added another.
- assertVisible: '(9|10) applications.*'
