# Smoke: the dev build launches on the phone and, signed out (clear state), shows the login screen.
appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
# 120 s: the first launch after starting Metro bundles from scratch (over 30 s on Raj's laptop).
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 120000
- assertVisible: Welcome back
