    timeout: 20000
- runFlow: _demo/pause-500.yaml
- extendedWaitUntil:
    visible:
      id: applications.tab.all
    timeout: 90000
- runFlow: _demo/pause-500.yaml
- scrollUntilVisible:
    element:
      id: application.row.5eed0000-0000-4000-8000-00000000a104
    timeout: 30000
- runFlow: _demo/pause-400.yaml
- runFlow: _demo/cap-application-documents-2.yaml
- tapOn:
    id: application.row.5eed0000-0000-4000-8000-00000000a104
- runFlow: _demo/pause-900.yaml
- extendedWaitUntil:
    visible:
      id: application.screen
    timeout: 15000
- runFlow: _demo/pause-500.yaml
