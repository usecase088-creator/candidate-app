# Visual tour (D32): one screenshot per screen, for pixel review on Android and the iPhone simulator.
#   maestro test e2e/tour/visual-tour.yaml -e OUT=<path prefix>   (the iOS workflow keeps output/)
# Needs the staging seed (demo applicant). Read-only apart from signing in: it changes no data.
# Leaving a pushed screen goes through _common/goBack.yaml (Back on Android, edge swipe on iOS).
appId: work.apronhanger.candidate.dev
env:
  OUT: output/tour-
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}01-home-guest
- runFlow: ../maestro/_common/openSignIn.yaml
- waitForAnimationToEnd
- takeScreenshot: ${OUT}02-login
- tapOn:
    id: auth.tab.signup
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${OUT}03-signup
# Android only (Maestro's back does nothing on iOS); the login helper relaunches the app anyway.
- back
- runFlow: ../maestro/_common/loginApplicant.yaml
- extendedWaitUntil:
    visible: 'Save Password.*'
    timeout: 10000
    optional: true
- runFlow: ../maestro/_common/iosPasswordSheet.yaml
# The sheet can open later than 10 s on a slow runner and hide Home: wait, close it if it came, wait again.
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 60000
    optional: true
- runFlow: ../maestro/_common/iosPasswordSheet.yaml
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${OUT}04-home
- scroll
- takeScreenshot: ${OUT}04b-home-scrolled
- scrollUntilVisible:
    element:
      id: home.link.gov
    direction: UP
- tapOn:
    id: home.link.gov
- extendedWaitUntil:
    visible:
      id: gov.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}05-gov
- runFlow: ../maestro/_common/goBack.yaml
- scrollUntilVisible:
    element:
      id: home.link.intl
    visibilityPercentage: 50
    timeout: 15000
    optional: true
- tapOn:
    id: home.link.intl
- extendedWaitUntil:
    visible:
      id: intl.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}06-intl
- runFlow: ../maestro/_common/goBack.yaml
- scrollUntilVisible:
    element:
      id: home.link.saved
    direction: UP
    visibilityPercentage: 50
    timeout: 15000
    optional: true
- tapOn:
    id: home.link.saved
- extendedWaitUntil:
    visible:
      id: saved.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}07-saved
- runFlow: ../maestro/_common/goBack.yaml
- tapOn:
    id: tabs.search
- waitForAnimationToEnd
- takeScreenshot: ${OUT}08-search
- scrollUntilVisible:
    element:
      id: search.filters
    visibilityPercentage: 50
    timeout: 15000
    optional: true
- tapOn:
    id: search.filters
- extendedWaitUntil:
    visible:
      id: filters.sheet
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}09-filters
- tapOn:
    id: filters.close
- tapOn:
    id: tabs.home
- scrollUntilVisible:
    element:
      id: 'job\.open\..*'
    visibilityPercentage: 50
    timeout: 20000
- tapOn:
    id: 'job\.open\..*'
    index: 0
- extendedWaitUntil:
    visible:
      id: job.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}10-job
- scroll
- takeScreenshot: ${OUT}10b-job-scrolled
- scrollUntilVisible:
    element:
      id: job.apply
    visibilityPercentage: 50
    timeout: 15000
    optional: true
- tapOn:
    id: job.apply
- extendedWaitUntil:
    visible:
      id: apply.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}11-apply
- scroll
- takeScreenshot: ${OUT}11b-apply-scrolled
- runFlow: ../maestro/_common/goBack.yaml
- runFlow: ../maestro/_common/goBack.yaml
- tapOn:
    id: tabs.applications
- extendedWaitUntil:
    visible:
      id: applications.tab.all
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}12-applications
- scrollUntilVisible:
    element:
      id: application.row.5eed0000-0000-4000-8000-00000000a102
- tapOn:
    id: application.row.5eed0000-0000-4000-8000-00000000a102
- extendedWaitUntil:
    visible:
      id: application.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}13-app-interview
- scroll
- takeScreenshot: ${OUT}13b-app-interview-scrolled
- runFlow: ../maestro/_common/goBack.yaml
- scrollUntilVisible:
    element:
      id: application.row.5eed0000-0000-4000-8000-00000000a106
- tapOn:
    id: application.row.5eed0000-0000-4000-8000-00000000a106
- extendedWaitUntil:
    visible:
      id: application.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}14-app-offer
- runFlow: ../maestro/_common/goBack.yaml
- scrollUntilVisible:
    element:
      id: application.row.5eed0000-0000-4000-8000-00000000a104
    direction: UP
    optional: true
- tapOn:
    id: application.row.5eed0000-0000-4000-8000-00000000a104
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${OUT}15-app-documents
- runFlow: ../maestro/_common/goBack.yaml
- tapOn:
    id: tabs.profile
- extendedWaitUntil:
    visible:
      id: profile.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}16-profile
- scroll
- takeScreenshot: ${OUT}16b-profile-scrolled
- scrollUntilVisible:
    element:
      id: profile.photo.open
    direction: UP
    visibilityPercentage: 50
    timeout: 15000
    optional: true
- tapOn:
    id: profile.photo.open
    optional: true
- extendedWaitUntil:
    visible:
      id: profile.photo.cancel
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ${OUT}17-photo-sheet
- tapOn:
    id: profile.photo.cancel
    optional: true
- scrollUntilVisible:
    element:
      id: profile.settings
- tapOn:
    id: profile.settings
- waitForAnimationToEnd
- takeScreenshot: ${OUT}18-settings
- scrollUntilVisible:
    element:
      id: settings.delete
    visibilityPercentage: 50
    timeout: 15000
    optional: true
- tapOn:
    id: settings.delete
- waitForAnimationToEnd
- takeScreenshot: ${OUT}19-delete
- runFlow: ../maestro/_common/goBack.yaml
- runFlow: ../maestro/_common/goBack.yaml
- scrollUntilVisible:
    element:
      id: profile.edit
    direction: UP
- tapOn:
    id: profile.edit
- extendedWaitUntil:
    visible:
      id: builder.screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}20-builder
- runFlow: ../maestro/_common/goBack.yaml
- tapOn:
    id: topbar.notifications
- waitForAnimationToEnd
- takeScreenshot: ${OUT}21-notifications
