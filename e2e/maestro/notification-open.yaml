# Notifications list: open it from the bell in the top bar and open the application a notification points to.
# Needs: the demo applicant with at least one notification whose link is /applications (seed it with the recruiter side
# or insert one on the dev database). Push delivery itself (a real phone with Firebase) is checked by hand, not here.
# NOT YET RUN ON A DEVICE (written 2026-10-28 overnight, no phone attached): run it once before relying on it.
appId: work.apronhanger.candidate.dev
---
- runFlow: _common/loginApplicant.yaml
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 20000
- tapOn:
    id: topbar.notifications
- extendedWaitUntil:
    visible:
      id: notifications.screen
    timeout: 20000
- assertVisible:
    id: notifications.unread
- tapOn:
    id: notifications.readAll
- tapOn:
    id: notifications.back
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
