# Create an account with a test number (OTP 123456 via the local backend's OTP test mode, D3).
# Repeatable: the backend seed frees the signup test numbers each time it starts (seedData.signupNumbers).
appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
- runFlow: _common/openSignIn.yaml
- tapOn:
    id: auth.tab.signup
- extendedWaitUntil:
    visible:
      id: signup.screen
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: signup.name
      - inputText: Maestro Tester
      - tapOn:
          id: signup.mobile
      - inputText: '9000000002'
      - tapOn:
          id: signup.email
      # A .test address: never a real-looking inbox.
      - inputText: ${'maestro+' + Date.now() + '@apronhanger.test'}
      # Keyboard "next" moves to the password field, as a user would (the field is under the keyboard here).
      - pressKey: Enter
      - inputText: Secret@123
      - runFlow: _common/hideKeyboard.yaml
# iPhone: with the keyboard up, the email and password fields sit behind it and a tap lands on the keyboard. So they are
# filled first, while the keyboard is down; then the name and the mobile number (the number pad has no Return key).
- runFlow:
    when:
      platform: iOS
    commands:
      # "Show" first (keyboard still down): iOS offers a strong password on hidden fields and that swallows the typed text.
      - tapOn:
          id: signup.password.toggle
      - tapOn:
          id: signup.email
      - inputText: ${'maestro+' + Date.now() + '@apronhanger.test'}
      - pressKey: Enter
      - retry:
          maxRetries: 3
          commands:
            - eraseText: 30
            - inputText: Secret@123
            - assertVisible: Secret@123
      - scrollUntilVisible:
          element:
            id: signup.name
          direction: UP
          timeout: 10000
      - tapOn:
          id: signup.name
      - inputText: Maestro Tester
      - pressKey: Enter
      - inputText: '9000000002'
- scrollUntilVisible:
    element:
      id: signup.privacy
- tapOn:
    id: signup.terms
- tapOn:
    id: signup.privacy
# Android: Send OTP sits under the consent boxes; scroll to it. No hideKeyboard here: the keyboard is already closed
# after the checkbox taps, and Maestro's hideKeyboard then presses Back, which leaves the form.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: signup.submit
          direction: DOWN
      - tapOn:
          id: signup.submit
# iPhone: the keyboard cannot be closed here (Return on a field with "next" moves to the next field), and Send OTP sits
# behind it, where Maestro still counts it as visible and taps the keyboard instead (ios-e2e runs 1 and 2: two spaces
# typed into the password, no OTP step). So send the form the way a person does with the keyboard: the number pad's
# "Next" goes to Email, Return to Password, and Return ("done") on the password sends the form and closes the keyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: Next
      - pressKey: Enter
      - pressKey: Enter
# Android: Google Password Manager may ask to save the new password right after the form is sent. It covers the app
# until it is answered. Close it with Back, like the login helper does: never "Continue" (it would save the test password
# to the owner's Google account) and never "Never" (it turns the prompt off for good).
- extendedWaitUntil:
    visible: 'Save password.*'
    timeout: 6000
    optional: true
- runFlow:
    when:
      platform: Android
      visible: 'Save password.*'
    commands:
      - back
# Android: tap Send OTP again if the OTP step has not appeared (a first tap can be swallowed). Not on the iPhone: there
# the OTP keyboard opens over the Verify button and a second tap would type a digit into the code.
- runFlow:
    when:
      platform: Android
      notVisible: 'Enter the OTP sent to 9000000002.'
    commands:
      - tapOn:
          id: signup.submit
- extendedWaitUntil:
    visible: 'Enter the OTP sent to 9000000002.'
    timeout: 20000
- tapOn:
    id: signup.otp
# The 6th digit submits the code on its own (D32); no tap on Verify.
- inputText: '123456'
# No hideKeyboard here: the code submits itself and closes the keyboard; on Android hideKeyboard presses Back.
- extendedWaitUntil:
    notVisible:
      id: signup.screen
    timeout: 30000
- extendedWaitUntil:
    visible: 'Save password.*'
    timeout: 8000
    optional: true
- runFlow:
    when:
      platform: Android
      visible: 'Save password.*'
    commands:
      - back
# iOS: the system "Save Password?" sheet. Never tap "Save".
- runFlow:
    when:
      platform: iOS
      visible: 'Save Password.*'
    commands:
      - tapOn: Not Now
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 20000
- assertVisible: Your next clinical role, curated for you.
