# A recruiter account can't sign in to the candidate app (website message), and no session is kept.
appId: work.apronhanger.candidate.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login.screen
    timeout: 120000
- tapOn:
    id: login.email
- inputText: recruiter@apronhanger.test
- tapOn:
    id: login.password
- inputText: Test@1234
- runFlow: _common/hideKeyboard.yaml
# iOS: Return on the password field already submits the form (see below); Android taps Sign in.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: login.submit
# iOS: the system "Save Password?" sheet covers the error message. Never tap "Save".
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Save Password.*'
          timeout: 20000
          optional: true
      - tapOn:
          text: Not Now
          optional: true
- extendedWaitUntil:
    visible: 'This email is registered as a recruiter account. Please sign in on the Recruiter Portal instead.'
    timeout: 20000
- assertVisible:
    id: login.screen
- assertNotVisible:
    id: home.screen
